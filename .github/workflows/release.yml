name: Build and Release Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/infinitefuel-1.0.0.jar
          tag_name: v1.0.0
          name: Infinite Fuel Mod 1.0.0
          body: |
            让煤炭和木炭在熔炉中无限燃烧的 **NeoForge 1.21.1 Mod**。

            ## 使用方法
            1. 安装 [NeoForge 1.21.1](https://neoforged.net/)
            2. 将下载的 `.jar` 文件放入 `.minecraft/mods` 文件夹
            3. 启动游戏
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
